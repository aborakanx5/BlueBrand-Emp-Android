name: Build BlueBrand EMB APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # مفتاح التوقيع الثابت (من الأسرار) — بدونه يطلع APK تجريبي ما ينثبت فوقه التحديث
      - name: Signing key
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > $RUNNER_TEMP/bb.keystore; echo "path=$RUNNER_TEMP/bb.keystore" >> $GITHUB_OUTPUT; else echo "::warning::ما فيه مفتاح توقيع — شغّل «Create signing key» وأضف الأسرار الأربعة"; fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk out/bluebrand-portal.apk
          else
            gradle assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk out/bluebrand-portal.apk
          fi
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          printf '{ "ver": "%s", "notes": "المكالمات الصوتية والمرئية والرسائل الصوتية في الدردشة" }\n' "$V" > out/version.json
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueBrand-Emp-APK
          path: out/*
          if-no-files-found: error
