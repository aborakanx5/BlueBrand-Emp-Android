name: Build BlueBrand Emp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract BlueBrand Emp project
        run: |
          mkdir -p extracted
          unzip "BlueBrand-Emp-Android-NewIcon.zip" -d extracted
          echo "Project extracted:"
          find extracted -maxdepth 3 -type f | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build BlueBrand Emp APK
        working-directory: extracted/BlueBrand-Emp-Android
        run: gradle assembleDebug --stacktrace

      - name: Upload BlueBrand Emp APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueBrand-Emp-APK
          path: extracted/BlueBrand-Emp-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
